name: Terraform Infrastructure

on:
  pull_request:
    paths:
      - "terraform-aws/**"
  push:
    branches:
      - develop # -> development environment
      - staging # -> staging environment
      - main # -> production environment
    paths:
      - "terraform-aws/**"

permissions:
  contents: read
  id-token: write # Required for AWS OIDC (Flow B2)
  pull-requests: write # For PR comments

env:
  TERRAFORM_VERSION: "1.11"
  AWS_REGION: us-east-1

jobs:
  # ============================================================
  # Terraform Plan (runs on all PRs and pushes)
  # ============================================================
  plan:
    name: Plan - ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [development, staging, production]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Flow B2: OIDC token exchange for AWS credentials
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      
      - name: Terraform Format Check
        run: |
          cd terraform-aws
          terraform fmt -check -recursive
        continue-on-error: true
      
      - name: Terraform Init
        run: |
          cd terraform-aws
          terraform init
      
      - name: Terraform Validate
        run: |
          cd terraform-aws
          terraform validate
      
      - name: Terraform Plan
        id: plan
        run: |
          cd terraform-aws
          terraform plan \
            -var-file=terraform-${{ matrix.environment }}.tfvars \
            -out=tfplan-${{ matrix.environment }} \
            -no-color
        continue-on-error: true
      
      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan: \`${{ matrix.environment }}\`
            
            <details><summary>Show Plan</summary>
            
            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            
            </details>
            
            **Result:** ${{ steps.plan.outcome }}
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
      
      - name: Fail if Plan Failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ============================================================
  # Apply to Development (auto-deploy on develop branch)
  # ============================================================
  apply-development:
    name: Apply to Development
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs: plan
    runs-on: ubuntu-latest
    environment: development
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Terraform Init
        run: |
          cd terraform-aws
          terraform init
      
      - name: Terraform Apply
        run: |
          cd terraform-aws
          terraform apply \
            -var-file=terraform-development.tfvars \
            -auto-approve
      
      # Flow B1: Seed third-party secrets
      - name: Seed Third-Party Secrets
        run: |
          npm install
          node scripts/secrets.js seed
        env:
          USE_LOCALSTACK: "false"
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Terraform Output
        run: |
          cd terraform-aws
          terraform output -json > outputs.json
          cat outputs.json

  # ============================================================
  # Apply to Staging (auto-deploy on staging branch)
  # ============================================================
  apply-staging:
    name: Apply to Staging
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    needs: plan
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Terraform Init
        run: |
          cd terraform-aws
          terraform init
      
      - name: Terraform Apply
        run: |
          cd terraform-aws
          terraform apply \
            -var-file=terraform-staging.tfvars \
            -auto-approve

      # Flow B1: Seed third-party secrets
      - name: Seed Third-Party Secrets
        run: |
          npm install
          node scripts/secrets.js seed
        env:
          USE_LOCALSTACK: "false"
          AWS_REGION: ${{ env.AWS_REGION }}

  # ============================================================
  # Apply to Production (requires approval)
  # ============================================================
  apply-production:
    name: Apply to Production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: plan
    runs-on: ubuntu-latest
    environment: production # GitHub environment with protection rules
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Terraform Init
        run: |
          cd terraform-aws
          terraform init
      
      - name: Terraform Apply
        run: |
          cd terraform-aws
          terraform apply \
            -var-file=terraform-production.tfvars \
            -auto-approve

      # Flow B1: Seed third-party secrets from GitHub Secrets
      - name: Seed Third-Party Secrets
        run: |
          npm install
          node scripts/secrets.js seed
        env:
          USE_LOCALSTACK: "false"
          AWS_REGION: ${{ env.AWS_REGION }}
          # Production secrets from GitHub Secrets
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          OAUTH_CLIENT: ${{ secrets.OAUTH_CLIENT }}
