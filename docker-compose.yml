# Docker Compose for LocalStack
# Used for local development and testing of AWS Secrets Manager

services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack-secrets
    ports:
      - "4566:4566"            # LocalStack Gateway
      - "4510-4559:4510-4559"  # External services port range
    environment:
      # Enable only the services we need
      - SERVICES=secretsmanager,sts,iam,ec2,rds
      # Debug logging (optional)
      - DEBUG=0
      # Persist data between restarts
      - PERSISTENCE=1
      # Data directory inside container
      - LOCALSTACK_DATA_DIR=/var/lib/localstack/data
    volumes:
      # Persist LocalStack data
      - localstack_data:/var/lib/localstack
      # Mount Docker socket for Lambda (if needed later)
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  localstack_data:
    driver: local
